name: Moodle Tag Action
description: Create a git tag from a Moodle plugin version on merged pull requests.
inputs:
  github_token:
    description: GitHub token used to push the tag.
    required: true
  version_file:
    description: Path to the Moodle version.php file.
    required: false
    default: version.php
  tag_prefix:
    description: Optional prefix to prepend to the generated tag.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Create tag
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_VERSION_FILE: ${{ inputs.version_file }}
        INPUT_TAG_PREFIX: ${{ inputs.tag_prefix }}
      run: bash "${{ github.action_path }}/create-tag.sh"
